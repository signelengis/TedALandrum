name: Fetch site images
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          mkdir -p images
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/01-n2s3-kaydet.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/Boeing_Stearman_N2S-3_Kaydet_%E2%80%9807539_-_143%E2%80%99_(N63590)_(33211843492).jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/02-ad4n-skyraider.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/Skyraider_AD-4N.jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/03-ad4w-skyraider-vc11.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/AD-4W_Skyraider_of_VC-11_Det.I_in_flight_off_Korea,_circa_in_1952.jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/04-f9f2-panther.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/Grumman_F9F-2_Panther_of_VF-112_in_flight,_circa_in_1951_(1564-78).jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/05-f9f8-cougar.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/Grumman_F9F-8_Cougar_of_VF-53_in_flight,_in_1956.jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/06-f2h2-banshee.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/McDonnell_F2H-2_Banshee_in_flight_(colour).jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/07-f3h2n-demon.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/McDonnell_F3H-2N_Demon_in_flight_in_1956.jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/08-f4b-phantom.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/McDonnell_F-4B_Phantom_II_of_VF-32_in_flight,_circa_in_1966.jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/09-a4e-skyhawk.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/Douglas_A-4E_Skyhawk_of_VA-164_in_flight_over_Vietnam_on_21_November_1967_(6430101).jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/10-twin-beech-18.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/Beech_18_-_Little_Gransden_2019.jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/11-jet-commander-1121.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/Aero_Commander_1121_Jet_Commander,_Private_JP5962515.jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/12-challenger-604.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/OH-WII_CL604_pvt_(7950005490).jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/13-astra-1125.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/IAI_1125_Astra.jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/14-falcon-20.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/Dassault_Falcon_20E_Belgium_-_Air_Force,_LUX_Luxembourg_(Findel),_Luxembourg_PP1278001849.jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/15-f4u4-corsair.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/Vought_F4U-4_Corsair_of_VF-33_in_flight,_circa_in_1950.jpg"
          curl -fSL --retry 3 -A "Mozilla/5.0" -o "images/16-fh1-phantom.jpg" "https://commons.wikimedia.org/wiki/Special:FilePath/FH-1_Phantom_of_VMF-122_at_NAS_Memphis_1949.jpg"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add images
          git diff --staged --quiet || git commit -m "Add aircraft images"
          git push
